<script>
function tpl(id){ return document.getElementById(id).textContent; }
var fP = document.getElementById('fPoster');
var fD = document.getElementById('fDoc');
function fit(f){
  try{
    var d = f.contentDocument;
    if(d && d.documentElement){ f.style.height = d.documentElement.scrollHeight + 'px'; }
  }catch(e){}
}
fP.srcdoc = tpl('tplPoster');
fD.srcdoc = tpl('tplDoc');
fP.onload = function(){ fit(fP); };
fD.onload = function(){ fit(fD); };
window.addEventListener('resize', function(){ fit(fP); fit(fD); });
function show(which){
  var pOn = which === 'p';
  document.getElementById('wrapDoc').hidden = pOn ? true : false;
  fP.parentElement.hidden = pOn ? false : true;
  document.getElementById('bPoster').className = pOn ? 'bt on' : 'bt';
  document.getElementById('bDoc').className = pOn ? 'bt' : 'bt on';
  if(pOn){ setTimeout(function(){ fit(fP); }, 60); }
  else { setTimeout(function(){ fit(fD); }, 60); }
  window.scrollTo(0, 0);
}
</script>
